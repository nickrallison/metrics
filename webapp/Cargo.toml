[package]
name = "benchmark-results-web"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.7", features = ["fullstack"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
benchmarks = { path = ".." }

[features]
default = []
web = ["dioxus/web"]
server = ["dioxus/server"]

